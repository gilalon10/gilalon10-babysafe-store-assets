<style>
:root{
  --navy:#16294A;--navy2:#1F3A68;--blue:#3E6FB8;--green:#20A957;--green2:#2DC46A;--mint:#E3F6EA;
  --coral:#F2552C;--coral-soft:#FDEBE5;
  --bg:#F7F6F2;--bg2:#FFFFFF;--ink:#14171C;--muted:#545A63;--line:#E4E2DA;--card:#FFFFFF;
  --shadow:0 1px 2px rgba(20,23,28,.04),0 12px 32px -12px rgba(20,23,28,.14);
  --r:22px;
  --font:"Plus Jakarta Sans",Heebo,"Noto Sans Arabic","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0E1116;--bg2:#141821;--ink:#F1F2F4;--muted:#A7ADB7;--line:#262B35;--card:#171B24;--mint:#12301F;--coral-soft:#3A1C14;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=he] body{font-family:Heebo,var(--font)}
html[lang=ar] body{font-family:"Noto Sans Arabic",var(--font)}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.4px;text-decoration:none;font-family:"Plus Jakarta Sans",sans-serif}
.brand img{width:34px;height:34px;border-radius:9px}
.b1{color:var(--navy2)}.b2{color:var(--green)}
@media (prefers-color-scheme:dark){.b1{color:#9DBBEA}}
.nav{display:flex;gap:26px;margin-inline-start:auto;font-size:15px;font-weight:600}
.nav a{text-decoration:none;color:var(--muted)}.nav a:hover{color:var(--ink)}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;font-weight:600;padding:8px 32px 8px 34px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
html[dir=rtl] .lang select{padding:8px 34px 8px 32px}
.lang svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;inset-inline-start:11px;width:16px;height:16px;color:var(--muted)}
.lang:after{content:"";position:absolute;top:50%;inset-inline-end:14px;width:6px;height:6px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn-s{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;white-space:nowrap}

.freebar{background:linear-gradient(90deg,#17944B,#22B35E);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:9px 16px;letter-spacing:.01em}
.freebar b{font-weight:800;text-transform:uppercase;letter-spacing:.06em}.freebar .dot{opacity:.6;margin:0 10px}
.freebar .rest:before{content:"·";opacity:.6;margin:0 10px}@media (max-width:560px){.freebar .rest{display:none}}
/* hero */
.hero{position:relative;padding:56px 0 90px;isolation:isolate}
.hero:before{content:"";position:absolute;inset:-80px 0 0;z-index:-1;background:
  radial-gradient(600px 420px at 78% 38%,rgba(45,196,106,.22),transparent 70%),
  radial-gradient(520px 380px at 92% 80%,rgba(62,111,184,.18),transparent 70%),
  radial-gradient(500px 300px at 10% 0%,rgba(62,111,184,.10),transparent 70%)}
html[dir=rtl] .hero:before{transform:scaleX(-1)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--green);box-shadow:0 8px 20px -8px rgba(32,169,87,.6);padding:8px 18px 8px 14px;border-radius:999px;margin-bottom:22px}
.eyebrow i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
h1{font-size:clamp(40px,6vw,72px);line-height:1.04;margin:0 0 22px;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
html[lang=he] h1,html[lang=ar] h1{letter-spacing:-.01em;line-height:1.12}
.sub{font-size:clamp(18px,2.1vw,22px);color:var(--muted);margin:0 0 34px;max-width:32ch}
.ctarow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);text-decoration:none;padding:14px 26px 14px 20px;border-radius:16px;font-weight:700;font-size:18px;box-shadow:0 10px 30px -10px rgba(20,23,28,.5);transition:transform .15s,box-shadow .15s}
html[dir=rtl] .play{padding:14px 20px 14px 26px}
.play:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(20,23,28,.55)}
.play svg{width:28px;height:28px;flex:none}
@media (prefers-color-scheme:dark){.play{background:#fff;color:#14171C}}
.stars{display:flex;flex-direction:column;font-size:14px;color:var(--muted);line-height:1.35}
.stars b{color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:30px;padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--muted)}
.chips svg{width:18px;height:18px;color:var(--green);flex:none}
.qrbox{display:none;align-items:center;gap:14px;margin-top:30px;padding:10px;padding-inline-end:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;width:max-content;box-shadow:var(--shadow)}
.qrbox svg{border-radius:8px;display:block}
.qrbox span{font-size:14px;font-weight:600;color:var(--muted);max-width:15ch;line-height:1.35}
@media (hover:hover) and (pointer:fine) and (min-width:900px){.qrbox{display:flex}}

.stage{position:relative;justify-self:center;width:min(330px,78vw)}
.stage .ph{display:block;width:100%;height:auto;border-radius:36px;box-shadow:0 50px 80px -30px rgba(22,41,74,.45),0 0 0 1px rgba(0,0,0,.04);transform:rotate(-2deg)}
html[dir=rtl] .stage .ph{transform:rotate(2deg)}
.float{position:absolute;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:230px;line-height:1.3;animation:bob 5s ease-in-out infinite}
.float .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.float .ic svg{width:19px;height:19px}
.f1{top:34%;inset-inline-start:-36%}.f1 .ic{background:var(--mint);color:var(--green)}
.f2{bottom:9%;inset-inline-end:-24%;animation-delay:-2.5s}.f2 .ic{background:var(--coral-soft);color:var(--coral)}
@keyframes bob{50%{transform:translateY(-8px)}}

/* sections */
section{padding:96px 0}
.kicker{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:0 0 12px}
h2{font-size:clamp(30px,4vw,46px);line-height:1.12;margin:0 0 18px;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:19px;color:var(--muted);max-width:56ch;margin:0}

/* why */
.why{background:var(--navy);color:#EEF2F8;position:relative;overflow:hidden}
.why:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 400px at 85% 10%,rgba(45,196,106,.18),transparent 70%),radial-gradient(500px 400px at 0% 100%,rgba(62,111,184,.35),transparent 70%)}
.why .wrap{position:relative;display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.why .kicker{color:#7FE0A5}
.big{font-size:clamp(84px,13vw,168px);font-weight:800;line-height:.9;letter-spacing:-.05em;font-family:"Plus Jakarta Sans",sans-serif;background:linear-gradient(135deg,#fff 30%,#7FE0A5);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;display:inline-block}
.why p{font-size:19px;color:#C8D2E2;margin:0 0 14px;max-width:52ch}
.why p.s1{font-size:22px;color:#fff;font-weight:600}
.why .src{font-size:13px;color:#93A3BC}
.why .src a{color:#93A3BC}

/* steps */
.head{max-width:720px;margin-bottom:48px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px 28px;box-shadow:var(--shadow);position:relative}
.step .n{position:absolute;top:22px;inset-inline-end:24px;font-weight:800;font-size:15px;color:var(--line);font-family:"Plus Jakarta Sans",sans-serif}
@media (prefers-color-scheme:dark){.step .n{color:#3a4150}}
.step .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:20px}
.step .ic svg{width:26px;height:26px}
.step:nth-child(1) .ic{background:var(--mint);color:var(--green)}
.step:nth-child(2) .ic{background:rgba(62,111,184,.12);color:var(--blue)}
.step:nth-child(3) .ic{background:var(--coral-soft);color:var(--coral)}
.step b{display:block;font-size:20px;line-height:1.3;margin-bottom:8px;letter-spacing:-.01em}
.step span{color:var(--muted);font-size:16px}

.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
.gallery img{width:100%;height:auto;border-radius:20px;border:1px solid var(--line);display:block;background:var(--card)}

/* video */
.vbox{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 40px 80px -30px rgba(22,41,74,.45);max-width:980px;margin:0 auto}
.vbox video{position:absolute;inset:0;width:100%;height:100%}
.center{text-align:center}.center .lead{margin-inline:auto}.center .head{margin-inline:auto}

/* faq */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;transition:box-shadow .2s}
details[open]{box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:700;font-size:18px;padding:20px 24px;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:24px;font-weight:500;color:var(--muted);transition:transform .2s;flex:none;line-height:1}
details[open] summary:after{transform:rotate(45deg)}
details p{margin:0;padding:0 24px 22px;color:var(--muted);font-size:16px}
.note{margin-top:20px;padding:16px 20px;border-inline-start:4px solid var(--coral);background:var(--card);border-radius:12px;font-size:15px;color:var(--muted)}

/* guide + final */
.guide{display:flex;align-items:center;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px;box-shadow:var(--shadow);text-decoration:none;max-width:860px;margin:0 auto;transition:transform .15s}
.guide:hover{transform:translateY(-2px)}
.guide .ic{width:56px;height:56px;border-radius:16px;background:var(--mint);color:var(--green);display:grid;place-items:center;flex:none}
.guide .ic svg{width:28px;height:28px}
.guide small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.guide b{display:block;font-size:20px;line-height:1.3;margin:2px 0}
.guide .go{margin-inline-start:auto;font-weight:700;font-size:15px;white-space:nowrap;color:var(--muted)}
html[dir=rtl] .guide .go .ar{display:inline-block;transform:scaleX(-1)}
.final{padding:0 0 96px}
.final .box{background:linear-gradient(135deg,#1A9E50,#22B35E 45%,#2E7DBF);color:#fff;border-radius:32px;padding:64px 40px;text-align:center;position:relative;overflow:hidden}
.final .box:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 260px at 15% 0%,rgba(255,255,255,.25),transparent 70%)}
.final h2{color:#fff;position:relative;margin-bottom:28px}
.final .play{background:#fff;color:#14171C;position:relative}
.final img{width:72px;height:72px;border-radius:18px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);margin-bottom:20px;position:relative}

footer{border-top:1px solid var(--line);padding:30px 0 44px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:14px 28px;flex-wrap:wrap;align-items:center}
footer .brand{font-size:17px}footer .brand img{width:26px;height:26px;border-radius:7px}
footer a{text-decoration:none}footer a:hover{text-decoration:underline}
footer .sp{margin-inline-start:auto}

.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.float,.eyebrow i{animation:none}}

@media (max-width:980px){
  .nav{display:none}.lang{margin-inline-start:auto}
  .hero .wrap,.why .wrap,.faq .wrap{grid-template-columns:1fr}
  .hero{padding-top:28px;text-align:center}
  .sub{margin-inline:auto}.ctarow,.chips{justify-content:center}
  .stage{width:min(270px,64vw);margin-top:10px}
  .f1{inset-inline-start:-22%}.f2{inset-inline-end:-18%}
  .steps{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(4,72%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .gallery img{scroll-snap-align:center}
  section{padding:72px 0}
  .faq .wrap{gap:28px}
}
@media (max-width:560px){
  .btn-s{display:none}
  .float{font-size:12px;padding:8px 10px;max-width:170px}.float .ic{width:28px;height:28px}
  .f1{display:none}.f2{inset-inline-end:-12%}
  .guide{flex-wrap:wrap;padding:22px}.guide .go{margin-inline-start:0}
  .final .box{padding:48px 22px}
  .play{font-size:16px}
}
</style>
</head>
<body>
<div class="freebar"><b data-x="b0"></b><span class="rest" id="fbrest"></span></div>
<header class="top" id="top"><div class="wrap">
  <a class="brand" href="#"><img src="img/icon.png" alt="" width="34" height="34"><span><span class="b1">Baby</span><span class="b2">Safe</span></span></a>
  <nav class="nav"><a href="#how" data-t="how"></a><a href="#video" data-t="video"></a><a href="#faq" data-t="faq"></a><a class="guide-link" href="guides/en.html" data-x="gk"></a></nav>
  <label class="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><select id="lang" aria-label="Language"></select></label>
  <a class="btn-s" data-play target="_blank" rel="noopener">Google Play</a>
</div></header>

<div class="hero"><div class="wrap">
  <div>
    <div class="eyebrow"><i></i><span data-x="b0"></span></div>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="ctarow">
      <a class="play" data-play target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#2DB55D" d="M3.6 1.8 13.8 12 3.6 22.2c-.4-.2-.6-.7-.6-1.2V3c0-.5.2-1 .6-1.2z"/><path fill="#FBBC04" d="m17.3 8.5-3.5 3.5 3.5 3.5 4-2.3c.9-.5.9-1.9 0-2.4z"/><path fill="#4285F4" d="M3.6 1.8c.3-.1.7-.1 1.1.1l12.6 6.6-3.5 3.5z"/><path fill="#EA4335" d="m13.8 12 3.5 3.5-12.6 6.6c-.4.2-.8.2-1.1.1z"/></svg>
        <span data-t="cta"></span>
      </a>
