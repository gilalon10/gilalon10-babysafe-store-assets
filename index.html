const NAMES={en:"English",he:"עברית",ar:"العربية",ru:"Русский",uk:"Українська",es:"Español",pt:"Português",fr:"Français",de:"Deutsch",it:"Italiano",tr:"Türkçe",hi:"हिन्दी",zh:"简体中文",zht:"繁體中文",ja:"日本語",ko:"한국어",id:"Bahasa Indonesia",vi:"Tiếng Việt",pl:"Polski",nl:"Nederlands"};
const HL={zht:"zh-TW",zh:"zh-CN",he:"iw"};
const STORE="https://play.google.com/store/apps/details?id=com.gilalon.babysafe";
function pick(){
  const q=new URLSearchParams(location.search).get("lang");
  if(q&&T[q])return q;
  for(const l of (navigator.languages||[navigator.language||"en"])){
    const s=l.toLowerCase();
    if(s.startsWith("zh"))return /tw|hk|mo|hant/.test(s)?"zht":"zh";
    let b=s.split("-")[0];if(b==="iw")b="he";if(b==="in")b="id";
    if(T[b])return b;
  }
  return "en";
}
const sel=document.getElementById("lang");
for(const k in NAMES){const o=document.createElement("option");o.value=k;o.textContent=NAMES[k];sel.appendChild(o);}
function apply(l){
  const t=T[l];
  document.documentElement.lang=l==="zht"?"zh-Hant":l;
  document.documentElement.dir=t.dir;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(e.dataset.t==="h1")e.innerHTML=v;else e.textContent=v;});
  document.querySelectorAll("[data-play]").forEach(a=>a.href=STORE+"&hl="+(HL[l]||l));
  document.title="BabySafe – "+t.h1.replace(/<br>/g," ");

  document.getElementById("steps").innerHTML=t.steps.map(s=>`<div class="step"><b></b><span></span></div>`).join("");
  document.querySelectorAll(".step").forEach((e,i)=>{e.querySelector("b").textContent=t.steps[i][0];e.querySelector("span").textContent=t.steps[i][1];});

  sel.value=l;
}
sel.onchange=()=>{apply(sel.value);const u=new URL(location);u.searchParams.set("lang",sel.value);history.replaceState(null,"",u);};
